<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prueba Plotly local</title>
</head>
<body>
  <h1>Prueba Plotly local</h1>
  <div id="chart" style="width:100%;max-width:900px;height:450px;"></div>

  <script src="./plotly.min.js"></script>
  <script>
    Plotly.newPlot("chart", [{
      x: ["A", "B", "C"],
      y: [1, 3, 2],
      type: "bar"
    }], {
      title: "Test Plotly"
    });
  </script>
</body>
</html>
