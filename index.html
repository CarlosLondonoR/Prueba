<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prueba CSV GitHub Pages</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      line-height: 1.4;
    }
    .ok { color: #0a7a2f; }
    .err { color: #b00020; }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 16px;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #f5f5f5;
    }
    code {
      background: #f3f3f3;
      padding: 2px 4px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Prueba de lectura de CSV</h1>
  <p>Si esto funciona, tu app podrá leer <code>gaps.csv</code> y <code>trackrecord.csv</code> desde el mismo repo.</p>

  <div id="status">Cargando archivo...</div>
  <div id="output"></div>

  <script>
    const csvUrl = "./sample.csv";

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"' && inQuotes && next === '"') {
          field += '"';
          i++;
        } else if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === "," && !inQuotes) {
          row.push(field);
          field = "";
        } else if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && next === "\n") i++;
          row.push(field);
          if (row.length > 1 || row[0] !== "") rows.push(row);
          row = [];
          field = "";
        } else {
          field += char;
        }
      }

      if (field !== "" || row.length) {
        row.push(field);
        rows.push(row);
      }

      return rows;
    }

    function rowsToObjects(rows) {
      const headers = rows[0].map(h => h.trim());
      return rows.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, i) => {
          obj[h] = (r[i] ?? "").trim();
        });
        return obj;
      });
    }

    function renderTable(data) {
      const keys = Object.keys(data[0] || {});
      if (!keys.length) {
        return "<p>No hay datos para mostrar.</p>";
      }

      let html = "<table><thead><tr>";
      keys.forEach(k => html += `<th>${k}</th>`);
      html += "</tr></thead><tbody>";

      data.slice(0, 10).forEach(row => {
        html += "<tr>";
        keys.forEach(k => html += `<td>${row[k] ?? ""}</td>`);
        html += "</tr>";
      });

      html += "</tbody></table>";

      if (data.length > 10) {
        html += `<p>Mostrando 10 de ${data.length} filas.</p>`;
      }

      return html;
    }

    async function main() {
      try {
        const response = await fetch(csvUrl, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status} al leer ${csvUrl}`);
        }

        const text = await response.text();
        const rows = parseCSV(text);

        if (!rows.length || rows.length < 2) {
          throw new Error("El CSV no parece tener encabezado y datos.");
        }

        const data = rowsToObjects(rows);

        document.getElementById("status").innerHTML =
          `<span class="ok">CSV cargado correctamente.</span> Filas detectadas: ${data.length}.`;

        document.getElementById("output").innerHTML = renderTable(data);
      } catch (error) {
        document.getElementById("status").innerHTML =
          `<span class="err">Error:</span> ${error.message}`;
      }
    }

    main();
  </script>
</body>
</html>
